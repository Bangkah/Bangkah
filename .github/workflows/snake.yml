name: GitHub Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *' # update setiap hari pukul 00:00 UTC
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate GitHub Contribution Snake
        uses: platane/snk@v0.2.0
        with:
          github_token: ${{ secrets.SNAKE_TOKEN }}
          output: ./github-contribution-grid-snake.svg
          dark_output: ./github-contribution-grid-snake-dark.svg

      - name: Commit and Push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git commit -m "Update GitHub Snake"
          git push
