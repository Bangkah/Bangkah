name: WakaTime Readme

on:
  schedule:
    # Update tiap 2 jam
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update WakaTime Stats
    runs-on: ubuntu-latest
    steps:
