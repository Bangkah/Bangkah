name: Update GitHub Activity

on:
  schedule:
    - cron: "0 * * * *" # Berjalan otomatis setiap jam
  workflow_dispatch: # Memungkinkan Anda menjalankan manual
  push:
    branches: ["main"]

jobs:
  update-readme:
    name: Update this repo's README with recent activity
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}
        with:
          COMMIT_MSG: "Update recent GitHub activity"
          MAX_LINES: 5 # Jumlah aktivitas yang ingin ditampilkan
