name: Update GitHub Activity

on:
  schedule:
    - cron: "0 * * * *" # Berjalan otomatis setiap jam
  workflow_dispatch: # Tombol manual
  push:
    branches: ["main", "master"]

jobs:
  update-readme:
    name: Update Recent Activity
    runs-on: ubuntu-latest
    # Token PAT biasanya sudah mencakup izin write, jadi kita tetap sertakan ini untuk keamanan
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}
        with:
          COMMIT_MSG: "📝 Update recent activity [skip ci]"
          MAX_LINES: 5
